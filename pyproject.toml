[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-founds"
version = "1.0.0"
description = "QUANT FOUNDS - multi-engine quantitative trading analysis system (stdlib only)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[tool.setuptools.packages.find]
include = ["quant_founds*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
